name: Generate Snake Contribution Grid

on:
  # كايجري كل 12 ساعة تلقائياً
  schedule:
    - cron: "0 */12 * * *"
  
  # كايخليك تقدر تجريه يدويّاً وقتما بغيتي
  workflow_dispatch:
  
  # كايجري مع كل Push فـ main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # كيولد ملفات الـ SVG ديال اللعبة
      - name: generate-github-user-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # كيدير Push للملفات فـ branch سميتها output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
